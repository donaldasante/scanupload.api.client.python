[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "scan-upload-api-client"
version = "1.0.0"
description = "Python client for ScanUpload that acquires client-credentials bearer tokens and downloads session files"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Donald Asante"}
]
license = "MIT"
keywords = ["scanupload", "keycloak", "client-credentials", "bearer-token"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "respx>=0.23.0",
]
integration-test = [
    # FastAPI is only required by examples/integration_test.py; the runtime
    # ScanUpload API client stays free of web-framework dependencies.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/scan_upload_api_client"]
