[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "scan-upload-api-client"
version = "0.1.0"
description = "Python ScanUpload API Client for seamless integration into ScanUpload SAAS product"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Donald Asante"}
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]
asgi = [
    "fastapi>=0.110.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/scan_upload_api_client"]
